<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Apply - Veteran's Scene</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/assets/img/vs-favicon.png"/>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="app"></div>

    <!-- Import Vue 3 from CDN -->
    <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
      }
    }
    </script>

    <!-- Application Form -->
    <script type="module">
    import { ref, computed, createApp } from 'vue';

    const ApplyApp = {
      setup() {
        const formData = ref({
          preferAnonymous: false,
          firstName: '',
          lastName: '',
          email: '',
          phone: '',
          preferredContact: '',
          state: '',
          branch: '',
          yearsOfService: {
            start: null,
            end: null
          },
          rank: '',
          wars: [],
          tours: 0,
          deploymentLocations: [],
          applicationType: 'podcast-guest',
          story: '',
          additionalInfo: ''
        });

        const warInput = ref('');
        const deploymentInput = ref('');
        const loading = ref(false);
        const success = ref(false);
        const successData = ref(null);
        const error = ref('');

        // Check if at least one contact method is provided
        const hasContactMethod = computed(() => {
          return formData.value.email.trim() !== '' ||
                 formData.value.phone.trim() !== '' ||
                 formData.value.preferredContact.trim() !== '';
        });

        const branches = [
          'Army', 'Navy', 'Air Force', 'Marines',
          'Coast Guard', 'Space Force', 'National Guard', 'Reserves'
        ];

        const states = [
          'AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DE', 'FL', 'GA',
          'HI', 'ID', 'IL', 'IN', 'IA', 'KS', 'KY', 'LA', 'ME', 'MD',
          'MA', 'MI', 'MN', 'MS', 'MO', 'MT', 'NE', 'NV', 'NH', 'NJ',
          'NM', 'NY', 'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'RI', 'SC',
          'SD', 'TN', 'TX', 'UT', 'VT', 'VA', 'WA', 'WV', 'WI', 'WY'
        ];

        const addWar = () => {
          if (warInput.value.trim()) {
            formData.value.wars.push(warInput.value.trim());
            warInput.value = '';
          }
        };

        const removeWar = (index) => {
          formData.value.wars.splice(index, 1);
        };

        const addDeployment = () => {
          if (deploymentInput.value.trim()) {
            formData.value.deploymentLocations.push(deploymentInput.value.trim());
            deploymentInput.value = '';
          }
        };

        const removeDeployment = (index) => {
          formData.value.deploymentLocations.splice(index, 1);
        };

        const getApiUrl = () => {
          const hostname = window.location.hostname;
          const protocol = window.location.protocol;

          // Development: localhost, 127.0.0.1, or file protocol
          if (hostname === 'localhost' ||
              hostname === '127.0.0.1' ||
              hostname === '' ||
              protocol === 'file:') {
            return 'http://localhost:5000/api';
          }

          // Production: use relative path (proxied through web server)
          // This avoids hairpin NAT issues on Windows networks
          return '/api';
        };

        const submitWithFallback = async (endpoint, submissionData) => {
          const primaryUrl = getApiUrl();

          // Try primary URL first (with timeout)
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 second timeout

          try {
            const response = await fetch(`${primaryUrl}${endpoint}`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(submissionData),
              signal: controller.signal
            });
            clearTimeout(timeoutId);
            return { response, url: primaryUrl };
          } catch (error) {
            clearTimeout(timeoutId);
            throw error;
          }
        };

        const handleSubmit = async () => {
          error.value = '';

          // Validate branch selection
          if (!formData.value.branch || formData.value.branch.trim() === '') {
            error.value = 'Please select a military branch.';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          // Validate service start year
          if (!formData.value.yearsOfService.start || formData.value.yearsOfService.start === '') {
            error.value = 'Please enter your service start year.';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          // Validate story
          if (!formData.value.story || formData.value.story.trim() === '') {
            error.value = 'Please tell us your story.';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          // Validate contact method
          if (!hasContactMethod.value) {
            error.value = 'Please provide at least one way to contact you (email, phone, or describe your preferred contact method).';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          loading.value = true;

          try {
            console.log('Starting application submission...');

            // Prepare submission data with proper types
            const submissionData = {
              ...formData.value,
              yearsOfService: {
                start: parseInt(formData.value.yearsOfService.start),
                ...(formData.value.yearsOfService.end ? { end: parseInt(formData.value.yearsOfService.end) } : {})
              },
              tours: parseInt(formData.value.tours) || 0
            };

            console.log('Submission data:', submissionData);

            // Use fallback mechanism for robustness
            const { response, url } = await submitWithFallback('/applications/submit', submissionData);

            console.log('Submitted to:', url);
            const data = await response.json();
            console.log('Response:', data);

            if (!response.ok) {
              // Show detailed validation errors
              if (data.errors && Array.isArray(data.errors)) {
                const errorMessages = data.errors.map(e => e.message).join('\n- ');
                throw new Error(`Validation Error:\n- ${errorMessages}`);
              }
              throw new Error(data.message || 'Failed to submit application. Please try again.');
            }

            if (data.success) {
              // Redirect to thank you page
              window.location.href = '/application-submitted.html';
            }
          } catch (err) {
            console.error('Submission error:', err);
            error.value = err.message || 'Failed to submit application. Please try again. If the problem persists, please contact us directly.';
          } finally {
            loading.value = false;
          }
        };

        return {
          formData,
          warInput,
          deploymentInput,
          loading,
          success,
          error,
          branches,
          states,
          hasContactMethod,
          addWar,
          removeWar,
          addDeployment,
          removeDeployment,
          handleSubmit
        };
      },
      template: `
        <div class="min-h-screen bg-gray-900 text-gray-100">
          <!-- Simple Navigation Header -->
          <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md">
            <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
              <div class="flex items-center space-x-3">
                <img src="/assets/img/vs-logo.jpg" alt="VS Logo" class="w-10 h-10 rounded-lg">
                <a href="/index.html" class="text-2xl font-bold text-yellow-400 tracking-wide hover:text-yellow-300">
                  Veteran's Scene
                </a>
              </div>
              <a href="/index.html" class="text-gray-300 hover:text-yellow-400 font-medium transition">
                ← Back to Home
              </a>
            </div>
          </nav>

          <div class="py-12 px-4">
          <div class="max-w-4xl mx-auto">
            <div class="text-center mb-8">
              <h1 class="text-4xl font-bold text-yellow-400 mb-4">Apply to Participate</h1>
              <p class="text-gray-300">Share your story with Veteran's Scene</p>
            </div>

            <div v-if="success" class="bg-green-900 border border-green-700 text-green-200 px-6 py-4 rounded-lg mb-6">
              <h3 class="font-bold text-lg mb-2">Application Submitted Successfully!</h3>
              <p>Thank you for your interest. We will review your application and contact you soon.</p>
            </div>

            <div v-if="error" class="bg-red-900 border border-red-700 text-red-200 px-6 py-4 rounded-lg mb-6">
              {{ error }}
            </div>

            <div class="flex flex-col lg:flex-row gap-8">
              <!-- Main Form -->
              <form @submit.prevent="handleSubmit" class="bg-gray-800 rounded-lg shadow-xl p-8 space-y-8 flex-1">
              <!-- Personal Information -->
              <div>
                <h2 class="text-2xl font-bold text-yellow-400 mb-4 border-b border-gray-700 pb-2">Personal Information</h2>

                <!-- Anonymous Option -->
                <div class="bg-gray-700 rounded-lg p-4 mb-6 border border-gray-600">
                  <label class="flex items-start gap-3 cursor-pointer">
                    <input v-model="formData.preferAnonymous" type="checkbox"
                      class="mt-1 w-5 h-5 rounded border-gray-500 bg-gray-600 text-yellow-400 focus:ring-yellow-500 focus:ring-2" />
                    <div>
                      <span class="text-gray-100 font-medium">I would like to remain anonymous</span>
                      <p class="text-sm text-gray-400 mt-1">Your privacy matters. If checked, your name will not be shared publicly. We still need a way to contact you.</p>
                    </div>
                  </label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">First Name <span v-if="!formData.preferAnonymous" class="text-gray-500">(optional)</span></label>
                    <input v-model="formData.firstName" type="text"
                      class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500"
                      placeholder="Enter your first name" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Last Name <span class="text-gray-500">(optional)</span></label>
                    <input v-model="formData.lastName" type="text"
                      class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500"
                      placeholder="Enter your last name" />
                  </div>
                </div>

                <!-- Contact Information Section -->
                <div class="mt-6 bg-gray-750 rounded-lg p-4 border border-gray-600" :class="{'border-yellow-500 bg-gray-700': !hasContactMethod}">
                  <h3 class="text-lg font-semibold text-yellow-300 mb-3">How can we reach you?</h3>
                  <p class="text-sm text-gray-400 mb-4">Please provide at least one way for us to contact you. All contact information is kept confidential.</p>

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                      <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                      <input v-model="formData.email" type="email"
                        class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500"
                        placeholder="your.email@example.com" />
                    </div>
                    <div>
                      <label class="block text-sm font-medium text-gray-300 mb-2">Phone</label>
                      <input v-model="formData.phone" type="tel"
                        class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500"
                        placeholder="(555) 123-4567" />
                    </div>
                  </div>

                  <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Preferred Contact Method</label>
                    <textarea v-model="formData.preferredContact" rows="2" maxlength="500"
                      class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500"
                      placeholder="Let us know how you'd prefer to be contacted, or provide an alternative method (e.g., 'Text only', 'Call after 5pm', 'Contact via Signal', etc.)"></textarea>
                  </div>

                  <p v-if="!hasContactMethod" class="text-yellow-400 text-sm mt-3">Please provide at least one contact method above.</p>
                </div>

                <!-- State (optional now) -->
                <div class="mt-6">
                  <label class="block text-sm font-medium text-gray-300 mb-2">State <span class="text-gray-500">(optional)</span></label>
                  <select v-model="formData.state"
                    class="w-full md:w-1/2 px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    <option value="">Select State</option>
                    <option v-for="state in states" :key="state" :value="state">{{ state }}</option>
                  </select>
                </div>
              </div>

              <!-- Military Service -->
              <div>
                <h2 class="text-2xl font-bold text-yellow-400 mb-4 border-b border-gray-700 pb-2">Military Service</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Branch *</label>
                    <select v-model="formData.branch" required
                      class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                      <option value="">Select Branch</option>
                      <option v-for="branch in branches" :key="branch" :value="branch">{{ branch }}</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Rank</label>
                    <input v-model="formData.rank" type="text"
                      class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Service Start Year *</label>
                    <input v-model.number="formData.yearsOfService.start" type="number" required min="1900" :max="new Date().getFullYear()"
                      class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Service End Year</label>
                    <input v-model.number="formData.yearsOfService.end" type="number" min="1900" :max="new Date().getFullYear()"
                      class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500"
                      placeholder="Leave blank if currently serving" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Number of Tours</label>
                    <input v-model.number="formData.tours" type="number" min="0"
                      class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500" />
                  </div>
                </div>

                <div class="mt-6">
                  <label class="block text-sm font-medium text-gray-300 mb-2">Wars/Conflicts Served</label>
                  <div class="flex gap-2">
                    <input v-model="warInput" type="text" @keyup.enter="addWar"
                      class="flex-1 px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500"
                      placeholder="e.g., Vietnam, Gulf War, OEF, OIF" />
                    <button type="button" @click="addWar"
                      class="px-4 py-2 bg-yellow-400 hover:bg-yellow-300 text-gray-900 rounded-md font-semibold transition">
                      Add
                    </button>
                  </div>
                  <div v-if="formData.wars.length" class="mt-2 flex flex-wrap gap-2">
                    <span v-for="(war, index) in formData.wars" :key="index"
                      class="inline-flex items-center gap-2 px-3 py-1 bg-gray-700 text-gray-200 rounded-full">
                      {{ war }}
                      <button type="button" @click="removeWar(index)" class="text-red-400 hover:text-red-300">×</button>
                    </span>
                  </div>
                </div>

                <div class="mt-6">
                  <label class="block text-sm font-medium text-gray-300 mb-2">Deployment Locations</label>
                  <div class="flex gap-2">
                    <input v-model="deploymentInput" type="text" @keyup.enter="addDeployment"
                      class="flex-1 px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500"
                      placeholder="e.g., Iraq, Afghanistan, Korea" />
                    <button type="button" @click="addDeployment"
                      class="px-4 py-2 bg-yellow-400 hover:bg-yellow-300 text-gray-900 rounded-md font-semibold transition">
                      Add
                    </button>
                  </div>
                  <div v-if="formData.deploymentLocations.length" class="mt-2 flex flex-wrap gap-2">
                    <span v-for="(location, index) in formData.deploymentLocations" :key="index"
                      class="inline-flex items-center gap-2 px-3 py-1 bg-gray-700 text-gray-200 rounded-full">
                      {{ location }}
                      <button type="button" @click="removeDeployment(index)" class="text-red-400 hover:text-red-300">×</button>
                    </span>
                  </div>
                </div>
              </div>

              <!-- Application Details -->
              <div>
                <h2 class="text-2xl font-bold text-yellow-400 mb-4 border-b border-gray-700 pb-2">Application Details</h2>
                <div class="space-y-6">
                  <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">I'm interested in *</label>
                    <select v-model="formData.applicationType" required
                      class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500">
                      <option value="podcast-guest">Being a Podcast Guest</option>
                      <option value="volunteer">Volunteering</option>
                      <option value="participant">General Participation</option>
                      <option value="other">Other</option>
                    </select>
                  </div>

                  <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Your Story *</label>
                    <p class="text-sm text-gray-400 mb-2">Tell us about your military experience and what you'd like to share (max 5000 characters)</p>
                    <textarea v-model="formData.story" required rows="8" maxlength="5000"
                      class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500"></textarea>
                    <p class="text-sm text-gray-400 mt-1">{{ formData.story.length }}/5000 characters</p>
                  </div>

                  <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Additional Information</label>
                    <p class="text-sm text-gray-400 mb-2">Anything else you'd like us to know (max 2000 characters)</p>
                    <textarea v-model="formData.additionalInfo" rows="4" maxlength="2000"
                      class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500"></textarea>
                    <p class="text-sm text-gray-400 mt-1">{{ formData.additionalInfo.length }}/2000 characters</p>
                  </div>
                </div>
              </div>

              <div class="flex justify-between items-center pt-6 border-t border-gray-700">
                <a href="/" class="text-yellow-400 hover:text-yellow-300">&larr; Back to Home</a>
                <button type="submit" :disabled="loading || !hasContactMethod"
                  class="px-8 py-3 bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-bold rounded-md transition disabled:opacity-50 disabled:cursor-not-allowed">
                  <span v-if="loading">Submitting...</span>
                  <span v-else>Submit Application</span>
                </button>
              </div>
            </form>

              <!-- Sidebar - Ways to Connect -->
              <aside class="lg:w-80 space-y-6">
                <!-- Ways We Can Connect -->
                <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                  <h3 class="text-xl font-bold text-yellow-400 mb-4">Ways We Can Connect</h3>
                  <div class="space-y-4 text-gray-300 text-sm">
                    <div class="flex items-start gap-3">
                      <div class="w-8 h-8 bg-yellow-400 bg-opacity-20 rounded-full flex items-center justify-center flex-shrink-0">
                        <span class="text-yellow-400">1</span>
                      </div>
                      <div>
                        <p class="font-medium text-gray-100">Video Podcast</p>
                        <p>Join us remotely via video chat from the comfort of your home.</p>
                      </div>
                    </div>
                    <div class="flex items-start gap-3">
                      <div class="w-8 h-8 bg-yellow-400 bg-opacity-20 rounded-full flex items-center justify-center flex-shrink-0">
                        <span class="text-yellow-400">2</span>
                      </div>
                      <div>
                        <p class="font-medium text-gray-100">Audio Call</p>
                        <p>Prefer voice only? We can arrange a phone or audio-only session.</p>
                      </div>
                    </div>
                    <div class="flex items-start gap-3">
                      <div class="w-8 h-8 bg-yellow-400 bg-opacity-20 rounded-full flex items-center justify-center flex-shrink-0">
                        <span class="text-yellow-400">3</span>
                      </div>
                      <div>
                        <p class="font-medium text-gray-100">In-Person</p>
                        <p>Local to the area? Join us in our studio for a face-to-face conversation.</p>
                      </div>
                    </div>
                  </div>
                  <a href="/participant-guide.html" class="mt-6 block text-center bg-gray-700 hover:bg-gray-600 text-yellow-400 font-medium py-2 px-4 rounded-lg transition">
                    View Participant Guide &rarr;
                  </a>
                </div>

                <!-- What to Expect -->
                <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                  <h3 class="text-xl font-bold text-yellow-400 mb-4">What to Expect</h3>
                  <ul class="space-y-3 text-gray-300 text-sm">
                    <li class="flex items-start gap-2">
                      <span class="text-green-400 mt-0.5">&#10003;</span>
                      <span>We'll review your application within a few days</span>
                    </li>
                    <li class="flex items-start gap-2">
                      <span class="text-green-400 mt-0.5">&#10003;</span>
                      <span>A team member will reach out using your preferred contact method</span>
                    </li>
                    <li class="flex items-start gap-2">
                      <span class="text-green-400 mt-0.5">&#10003;</span>
                      <span>If selected, you'll receive a briefing call before recording</span>
                    </li>
                    <li class="flex items-start gap-2">
                      <span class="text-green-400 mt-0.5">&#10003;</span>
                      <span>No pressure - participation is always voluntary</span>
                    </li>
                  </ul>
                </div>

                <!-- Privacy Note -->
                <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                  <h3 class="text-lg font-bold text-yellow-400 mb-3">Your Privacy Matters</h3>
                  <p class="text-gray-400 text-sm">
                    Your contact information is kept confidential and only used to communicate with you about your application. If you choose to remain anonymous, your identity will not be shared publicly.
                  </p>
                </div>
              </aside>
            </div>
            </div>
          </div>
        </div>
      `
    };

    createApp(ApplyApp).mount('#app');
    </script>
</body>
</html>
