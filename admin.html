<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Veteran's Scene - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/assets/img/vs-favicon.png"/>
    <link rel="stylesheet" href="./app/styles/highlight-obs.css?v=20260203"/>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="app">
      <!-- Shown while Vue loads, or if JS fails -->
      <div id="app-loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;">
        <img src="/assets/img/vs-logo.jpg" alt="Logo" style="width:64px;height:64px;border-radius:8px;">
        <p style="color:#facc15;font-size:18px;font-weight:bold;">Loading...</p>
        <noscript>
          <p style="color:#f87171;margin-top:16px;">JavaScript is required. Please enable JavaScript in your browser settings.</p>
        </noscript>
      </div>
    </div>

    <!-- Import Vue 3 from CDN -->
    <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
        "vue-router": "https://unpkg.com/vue-router@4/dist/vue-router.esm-browser.js",
        "@vue/devtools-api": "https://unpkg.com/@vue/devtools-api@6/lib/esm/index.js"
      }
    }
    </script>

    <!-- Admin Portal Entry Point -->
    <script type="module" src="./app/main-admin.js?v=20260410"></script>
</body>
</html>
